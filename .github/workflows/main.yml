name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Rebuild Android Environment
      run: |
        rm -rf android
        flutter create . --platforms=android --org com.mbplayer.app

    - name: Configure Android SDK & Permissions
      run: |
        cat << 'EOF' > fix_config.py
        import os, glob

        for path in glob.glob('android/app/build.gradle*'):
            with open(path, 'r', encoding='utf-8') as f:
                content = f.read()
            content = content.replace('flutter.minSdkVersion', '21')
            content = content.replace('flutter.compileSdkVersion', '34')
            with open(path, 'w', encoding='utf-8') as f:
                f.write(content)

        manifest = 'android/app/src/main/AndroidManifest.xml'
        if os.path.exists(manifest):
            with open(manifest, 'r', encoding='utf-8') as f:
                content = f.read()
            if 'INTERNET' not in content:
                content = content.replace('\n    <application')
                with open(manifest, 'w', encoding='utf-8') as f:
                    f.write(content)
        EOF
        python3 fix_config.py

    - name: Get dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
