name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Generate Android Files & Configure Android SDK
      run: |
        flutter create . --platforms=android --org com.mbplayer.app
        python3 -c "
        import os, glob

        # 1. Update MinSDK to 21 in build.gradle or build.gradle.kts
        for path in glob.glob('android/app/build.gradle*'):
            with open(path, 'r') as f:
                content = f.read()
            content = content.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
            content = content.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
            content = content.replace('flutter.minSdkVersion', '21')
            with open(path, 'w') as f:
                f.write(content)

        # 2. Add Internet Permission to AndroidManifest.xml
        manifest_path = 'android/app/src/main/AndroidManifest.xml'
        if os.path.exists(manifest_path):
            with open(manifest_path, 'r') as f:
                m_content = f.read()
            if 'android.permission.INTERNET' not in m_content:
                m_content = m_content.replace('\n    <application')
                with open(manifest_path, 'w') as f:
                    f.write(m_content)
        "

    - name: Get dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
