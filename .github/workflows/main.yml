name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Rebuild Android Environment
      run: |
        rm -rf android
        flutter create . --platforms=android --org com.mbplayer.app

    - name: Configure Android SDK & Permissions
      run: |
        python3 -c "
        import os, glob

        for path in glob.glob('android/app/build.gradle*'):
            with open(path, 'r') as f:
                content = f.read()
            content = content.replace('flutter.minSdkVersion', '21')
            content = content.replace('flutter.compileSdkVersion', '34')
            content = content.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
            content = content.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 34')
            with open(path, 'w') as f:
                f.write(content)

        manifest_path = 'android/app/src/main/AndroidManifest.xml'
        if os.path.exists(manifest_path):
            with open(manifest_path, 'r') as f:
                m = f.read()
            if 'android.permission.INTERNET' not in m:
                m = m.replace('\n    <application')
                with open(manifest_path, 'w') as f:
                    f.write(m)
        "

    - name: Get dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
